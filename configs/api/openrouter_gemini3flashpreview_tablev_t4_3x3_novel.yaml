# Checked-in configuration is intentionally offline. Create a private copy before enabling API calls.
experiment:
  api_enabled: false
  max_calls: 0
  approval_file: null
  expected_split: novel

model:
  api_key_env: OPENROUTER_API_KEY
  base_url_env: OPENROUTER_BASE_URL
  model_env: OPENROUTER_GEMINI3_FLASH_PREVIEW_MODEL

request:
  temperature: 0
  max_tokens: 512
  timeout_seconds: 120
  max_retries: 0
  backoff_seconds: 2
  concurrency: 1
  image_transport: data_url
  image_detail: auto

response_parser: legacy_numbered_action_names

prompt:
  version: table_v_t4_3x3_legacy_novel_v2
  mode: table_v_legacy
  path: configs/api/prompts/tablev_t4_3x3_legacy_novel_v2.json
