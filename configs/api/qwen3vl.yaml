# Phase 1 safety gate: checked-in configuration can never issue a network request.
experiment:
  api_enabled: false
  max_calls: 0
  approval_file: null

model:
  api_key_env: DASHSCOPE_API_KEY
  base_url_env: QWEN_BASE_URL
  model_env: QWEN_MODEL

request:
  temperature: 0
  max_tokens: 64
  timeout_seconds: 120
  max_retries: 5
  backoff_seconds: 2
  concurrency: 1
  image_transport: data_url

prompt:
  version: planning_v1
  path: configs/api/prompts/planning_v1.txt
