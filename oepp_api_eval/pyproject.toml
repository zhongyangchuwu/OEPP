[project]
name = "oepp-api-eval"
version = "0.1.0"
description = "Auditable remote Qwen3-VL evaluation for Open-Event Procedure Planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<12",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
package = false

[tool.pyright]
extraPaths = ["src"]
